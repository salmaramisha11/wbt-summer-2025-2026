<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Form</title>
</head>
<body>
    <h1>Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>My Form</legend>
            <br>
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required>
            <br><br>
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" required>
            <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" required>
            <br><br>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
        <fieldset>
            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="EEE">EEE</option>
                <option value="IPE">IPE</option>

            </select>
            <br><br>
 
            <input type="checkbox" id="c" name="language" value="C" required>
            <label for="c">C</label>
            <input type="checkbox" id="cpp" name="language" value="C++" required>
            <label for="cpp">C++</label>
            <input type="checkbox" id="java" name="language" value="Java" required>
            <label for="java">Java</label>
            <br><br>
        </fieldset>
            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your address here..." required></textarea>
            <br><br>
            <label for="photo"> Upload Student Photo:</label><br>
            <input type="file" id="photo" name="photo">
            <br><br>
            <label for="comments">Comments/Suggestions:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40" maxlength="200" placeholder="Enter your comments or any suggestions..."></textarea>
        </fieldset>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
