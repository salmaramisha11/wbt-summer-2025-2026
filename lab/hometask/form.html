<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>
            <br>
            <label for="fname">Full Name:</label>
            <input type="text" id="fname" name="fname" required>
            <br><br>
            <label for="id">Student ID:</label>
            <input type="text" id="id" name="id" required>
            <br><br>
            <label for="email"> Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
            <br><br>
            <label for="dob"> Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
            <label for="Gender">Gender:</label>
            <input type="radio" placeholder="Male" name="male" id="male"> Male
            <input type="radio" placeholder="Female" name="female" id="female"> Female
            <input type="radio" placeholder="Other" name="other" id="other"> Other
            <br>
        </fieldset>
        <fieldset>
         <legend>Academic Information</legend>
          <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE </option>
                <option value="EEE">EEE</option>
                <option value="BBA">BBA</option>
                <option value="English">English</option>
                <option value="Civil Engineering">Civil Engineering</option>
            </select>
            <br><br>
            <label for="semester">Semester:</label>
             <select id="semester" name="semester" required>
                <option value="">Select Semester</option>
                <option value="1st">1st semester</option>
                <option value="2nd">2nd semester</option>
                <option value="3rd">3rd semester</option>
                <option value="4th">4th semester</option>
                <option value="5th">5th semester</option>
                <option value="6th">6th semester</option>
                <option value="7th">7th semester</option>
                <option value="8th">8th semester</option>
            </select>
            <br><br>
        </fieldset>
        <fieldset>
            <legend>Skills</legend>
            <label for="semester">Select Programming Languages Known:</label>
            <br>
            <input type="checkbox" id="c" name="language" value="C" required>
            <label for="c">C</label><br>
            <input type="checkbox" id="cpp" name="language" value="C++" required>
            <label for="cpp">C++</label><br>
            <input type="checkbox" id="java" name="language" value="Java" required>
            <label for="java">Java</label><br>
            <input type="checkbox" id="python" name="language" value="python" required>
            <label for="python">Python</label><br>
            <input type="checkbox" id="javascript" name="language" value="javascript" required>
            <label for="javascript">JavaScript</label>
            <br><br>
        </fieldset>
        <fieldset>
            <legend>Additional Information</legend>
            <label>Address:</label>
            <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your address here..." required></textarea>
            <br><br>
            <label for="photo">Upload Student Photo:</label><br>
            <input type="file" id="photo" name="photo">
            <br><br>
            <label for="comments">Comments/Suggestions:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40" maxlength="200" placeholder="Enter your comments or any suggestions..."></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

</body>

</html>
